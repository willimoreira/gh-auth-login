name: Jarvis
options:
  bundleIdPrefix: com.willimoreira
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""            # defina seu Team ID aqui ou no Xcode
    TARGETED_DEVICE_FAMILY: "1"     # iPhone

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    minorVersion: 0.17.7

targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Jarvis
    entitlements:
      path: Jarvis/Resources/Jarvis.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Jarvis/Resources/Info.plist
      properties:
        CFBundleDisplayName: J.A.R.V.I.S.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "O J.A.R.V.I.S. precisa do microfone para ouvir seus comandos de voz."
        NSSpeechRecognitionUsageDescription: "O J.A.R.V.I.S. transcreve sua voz no próprio aparelho para entender seus comandos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willimoreira.jarvis
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: FluidAudio
        product: FluidAudio
